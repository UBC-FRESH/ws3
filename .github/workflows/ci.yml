name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main, develop]
  release:
    types: [published]

jobs:
  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 mypy pytest
    
    - name: Run flake8
      run: |
        flake8 ws3/ tests/
    
    # Advisory only. ws3 carries ~323 pre-existing mypy errors from the partial
    # typing migration in Phase 2. Failing the build on them would put this job
    # back into the permanently-red state that made CI meaningless (see #94).
    # Flip continue-on-error off once the typing debt is cleared.
    - name: Run mypy (advisory)
      continue-on-error: true
      run: |
        mypy ws3/ --ignore-missing-imports
    
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Deliberately NOT dependent on lint. Previously 'needs: lint' meant a single
    # style finding skipped test, docs, and build, so the pipeline reported
    # nothing at all. Lint and tests are independent signals and should be able
    # to fail independently.
    
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    
    - name: Run tests
      run: pytest tests/ -v --tb=short
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-py${{ matrix.python-version }}
        path: |
          tests/results/
          pytest-html/
    
  docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[docs]"
    
    - name: Build documentation
      run: |
        sphinx-build -b html docs/source docs/build/html
    
    - name: Upload documentation
      uses: actions/upload-artifact@v4
      with:
        name: documentation
        path: docs/build/html/
    
  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [test, docs]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    
    - name: Build package
      run: python -m build
    
    - name: Check package
      run: twine check dist/*
    
    - name: Upload distribution files
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
    
  notify:
    name: Notify
    runs-on: ubuntu-latest
    if: always() && !cancelled()
    
    steps:
    - name: Check status
      run: |
        echo "CI/CD Pipeline Completed"
        echo "Build Status: ${{ job.status }}"
        echo "Commit: ${{ github.sha }}"
        echo "Branch: ${{ github.ref_name }}"
