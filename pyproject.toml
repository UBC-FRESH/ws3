[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ws3"
authors = [{name = "Gregory Paradis", email = "gregory.paradis@ubc.ca"}]
dynamic = ["version", "description"]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.21",
  "pandas>=1.3",
  "scipy>=1.7",
  "matplotlib",
  "rasterio",
  "fiona",
  "profilehooks",
  "dill",
  "highspy",
  "pyyaml>=5.1"
]
maintainers = [
  {name = "Kathleen Coupland", email = "kathleen.coupland@ubc.ca"},
  {name = "Elaheh Ghasemi", email = "elaheh.ghasemi@ubc.ca"},
  {name = "Salar Ghotb", email = "salar.ghotb@ubc.ca"}
]

[project.optional-dependencies]
cbm = ["libcbm"]  # pip users can `pip install ws3[cbm]`
gurobi = ["gurobipy"]
pulp = ["pulp"]
# Probabilistic (random variable) financial analysis.
#
# PaCal is GPL-3.0-or-later while ws3 is MIT, so it is deliberately an optional
# extra that the user installs themselves. It is never bundled with ws3.
#
# PaCal does not declare its own dependencies, hence sympy and setuptools here.
# It also predates NumPy 2.0; ws3.financial applies a small compatibility shim
# for the aliases NumPy removed. See #101 and #102.
rv = [
    "pacal>=1.6.1",
    "sympy",
    "setuptools",
]
docs = [
    "sphinx>=7",
    "sphinx-rtd-theme>=2",
    "nbsphinx>=0.9",
    "sphinxcontrib-mermaid>=0.9",
]
release = [
    "build",
    "twine",
]
dev = [
    "pytest",
    "pytest-cov",
    "coverage",
    "flake8",
    "mypy",
    "ruff",
]
# Validated, agent-backed capabilities. Entirely optional: core ws3 modelling
# never needs it, and `import ws3` never loads it.
agent = [
    "fresh-agent-core>=0.1.0a1",
]
# Adds the MCP server, so an external coding agent discovers the capabilities as
# tools rather than having to be told they exist.
agent-mcp = [
    "fresh-agent-core[mcp]>=0.1.0a1",
]
github-mcp = [
    "github-mcp-server",  # GitHub MCP server for enhanced GitHub integration
]

[project.scripts]
# MCP server exposing ws3's validated capabilities. Requires ws3[agent-mcp].
ws3-agent-mcp = "ws3.agent.mcp_server:main"

[tool.hatch.version]
source = "code"
path = "ws3/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["ws3"]

[tool.hatch.build]
include = [
  "ws3",
  "README.md",
  "LICENSE"
]

[tool.hatch.publish.index.test]
url = "https://test.pypi.org/legacy/"

[tool.hatch.envs.default.scripts]
clean = "rm -rf dist/ build/ *.egg-info"
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
strict = true
# Local type stubs for vendored optional dependencies without published stubs.
mypy_path = "_stubs"
# Disabled deliberately. With ignore_missing_imports = true, an absent optional
# dependency is typed as Any, which makes every `# type: ignore` on lines touching
# it look unused. ws3/financial.py alone flips 19 findings depending on whether
# PaCal happens to be installed, so this check reports differently in CI than
# locally and cannot be acted on reliably. Revisit as part of #98.
warn_unused_ignores = false
warn_redundant_casts = true
check_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "C4", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"ws3/__init__.py" = ["F401"]
"tests/*" = ["D100", "D101", "D102", "D103", "D104"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["ws3"]
omit = ["tests/*", "docs/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
]
