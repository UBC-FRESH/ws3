[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ws3"
authors = [{name = "Gregory Paradis", email = "gregory.paradis@ubc.ca"}]
dynamic = ["version", "description"]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.21",
  "pandas>=1.3",
  "scipy>=1.7",
  "matplotlib",
  "rasterio",
  "fiona",
  "profilehooks",
  "dill",
  "highspy"
]
maintainers = [
  {name = "Kathleen Coupland", email = "kathleen.coupland@ubc.ca"},
  {name = "Elaheh Ghasemi", email = "elaheh.ghasemi@ubc.ca"},
  {name = "Salar Ghotb", email = "salar.ghotb@ubc.ca"}
]

[project.optional-dependencies]
cbm = ["libcbm"]  # pip users can `pip install ws3[cbm]`
gurobi = ["gurobipy"]
pulp = ["pulp"]
docs = [
    "sphinx>=7",
    "sphinx-rtd-theme>=2",
    "nbsphinx>=0.9",
]
release = [
    "build",
    "twine",
]
github-mcp = [
    "github-mcp-server",  # GitHub MCP server for enhanced GitHub integration
]

[tool.hatch.version]
source = "code"
path = "ws3/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["ws3"]

[tool.hatch.build]
include = [
  "ws3",
  "README.md",
  "LICENSE"
]

[tool.hatch.publish.index.test]
url = "https://test.pypi.org/legacy/"

[tool.hatch.envs.default.scripts]
clean = "rm -rf dist/ build/ *.egg-info"
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "C4", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"ws3/__init__.py" = ["F401"]
"tests/*" = ["D100", "D101", "D102", "D103", "D104"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["ws3"]
omit = ["tests/*", "docs/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
]
